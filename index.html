<!DOCTYPE html>
<html>

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Cal+Sans&family=Baumans&family=Sulphur+Point&family=Didact+Gothic&display=swap"
    rel="stylesheet">
  <meta charset="UTF-8">
  <title>coolaura</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <button id="customize" onclick="showCustomizations()">ᝰ</button>
  <div id="Overlay2">
    <h1 id="customizationTitle">Customize:</h1>
    <div class="bar" id="bar2"></div>
    <span class="ops2" id="2sp1">Set wallpaper:</span>
    <input type="text" id="wpset" placeholder="Image link">
    <button id="wpsetter">✓</button>
  </div>
  <div id="Overlay1" onclick="hideOptions()">
    <h1 id="SettingsTitle">Options:</h1>
    <div class="bar" id="bar1"></div>
    <span class="ops1" id="sp1">Search engine:</span>
    <button class="optionButtons" id="seGoogleSearch">Google</button>
    <button class="optionButtons" id="seDuckduckgo">Duckduckgo</button>
  </div>
  <button id="menu" onclick="showOptions()">⋮</button>
  <img src="logo.png" id="logo">
  <div id="mainContainer">
    <h1 id="slogan">
      THE WEBSITE<br> TO DO EVERYTHING.
    </h1>
    <div id="searchbar">
      <input id="tInput" type="text">
      <p id="Sicon">⌕</p>
    </div>
    <p id="response"></p>
  </div>
  <script src="lib.js"></script>
</body>

</html>
