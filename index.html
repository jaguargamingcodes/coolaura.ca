<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Didact+Gothic&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <title>New Tab</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.png">
</head>

<body>
  <div id="main_container">
    <img src="logo.png" id="logo">
    <p id="slogan">One search. Many engines.</p>
    <div id="searchbar">
      <input id="search_input" placeholder="Search coolaura..." type="text">
      <button id="search">
        <img id="sIcon" src="Search_icon.png">
      </button>
    </div>
    <div id="gap"></div>
    <div id="engine_container">
      <img id="theme" class="searchimgs" onclick="toggleTheme()" src="themeL.png">
      <div class="bar"></div>
      <img id="wallpaper" class="searchimgs" onclick="setWP()" src="WPicon.png">
      <div class="bar"></div>
      <img id="info" class="searchimgs" onclick="i()" src="info.png">
      <div class="bar"></div>
    </div>
  </div>
  <script src="lib.js">
  </script>
</body>

</html>
